name: Deploy to Github Pages

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            # Give the default GITHUB_TOKEN write permission to commit and push the
            # added or changed files to the repository.
            contents: write

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Cache Hugo resources
              uses: actions/cache@v4
              env:
                  cache-name: cache-hugo-resources
              with:
                  path: resources
                  key: ${{ env.cache-name }}

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v2
              with:
                  # PaperMod is vendored in themes/ and tested with this version
                  hugo-version: "0.111.3"
                  extended: true

            - name: Build
              run: hugo --minify --gc

            - name: Deploy 🚀
              # Pull requests only build the site; publishing happens on push to main
              if: github.event_name != 'pull_request'
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  branch: gh-pages
                  folder: public
                  clean: true
                  single-commit: true
