    title: Ronard G. Paña
    subtitle: "Hello! I am an Assistant Professor at the Visayas State University in Baybay, Leyte, Philippines,
     and currently a Ph.D. candidate in Energy Engineering at the University of the Philippines Diliman.

     <br><br>
     My research interests include the modeling of energy and cooling systems and the application of
     artificial intelligence, particularly reinforcement learning, to energy systems. I have published
     journal articles and conference proceedings, and have presented my work at various international conferences.

     <br><br>
     Thank you for visiting my webpage!
     "
